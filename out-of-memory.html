<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aw, Snap!</title>
    <meta name="robots" content="noindex">
    <link
      rel="stylesheet"
      href="https://api.munetios.com/beautiful-css/beautiful.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,1..1000,90&display=swap"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        font-family: "Google Sans Flex", sans-serif;
      }
      .error-container {
        max-width: 600px;
        padding: 2rem;
      }
      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        font-size: 1rem;
        border: 1px solid rgba(98, 0, 234, 0.53);
        background-color: rgba(98, 0, 234, 0.53);
        color: white;
        border-radius: 44px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="error-container liquid-glass">
      <h1>Aw, Snap!</h1>
      <p>
        Out of memory. Please try deleting some of your documents or closing
        other tabs.
      </p>
      <button onclick="window.location.href='index.html'">Reload</button>
    </div>
  </body>
</html>
